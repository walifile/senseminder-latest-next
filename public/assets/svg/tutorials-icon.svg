<svg
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient
      id="tutorials_gradient"
      x1="2"
      y1="2"
      x2="22"
      y2="22"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#8086F3"/>
      <stop offset="0.5" stop-color="#4C55F8"/>
      <stop offset="1" stop-color="#D971FF"/>
